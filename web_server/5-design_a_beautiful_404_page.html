<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Lost in the Cloud</title>
    <style>
        body {
            margin: 0;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            max-width: 700px;
        }

        h1 {
            font-size: 100px;
            margin: 0;
            color: #00bfff;
        }

        h2 {
            margin-top: 0;
            font-weight: normal;
            color: #f8f8f8;
        }

        .message {
            font-size: 22px;
            margin: 20px 0;
            color: #ffcc00;
        }

        .code-box {
            background-color: #111;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 18px;
            color: #00ff99;
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.7;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #00bfff;
            color: black;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .button:hover {
            background: #ffcc00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Oops. You built the wrong block.</h2>

        <div class="message">
            Ceci n'est pas une page
        </div>

        <div class="code-box">
            > Error: Page not found in this universe.<br>
            > Try pushing the right commit 🚀
        </div>

        <a href="/" class="button">Return Home</a>

        <div class="footer">
            Powered by DevOps creativity ⚙️
        </div>
    </div>
</body>
</html>
